<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="8"/>
  
  <!-- Activity / Pulse Heartbeat Line -->
  <path d="M 80 256 L 160 256 L 200 140 L 260 372 L 320 210 L 350 256 L 432 256" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Coin Badge at Top Right -->
  <circle cx="390" cy="120" r="48" fill="url(#coinGrad)"/>
  <circle cx="390" cy="120" r="38" fill="none" stroke="#fef3c7" stroke-width="4"/>
  <text x="390" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#78350f" text-anchor="middle">H</text>
</svg>
